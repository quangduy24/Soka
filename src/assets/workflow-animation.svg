<svg width="100%" height="100%" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="meshPurple" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshIndigo" cx="18%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nodeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150830" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0a0416" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="rgba(255,255,255,0.055)"/>
    </pattern>

    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="particleGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .rect-bg { fill: transparent; }
    .node-rect { fill: url(#nodeGlass); stroke: rgba(198,255,0,0.28); stroke-width: 1.2; }
    .node-active { stroke: #CCFF00; stroke-width: 1.6; }
    .node-safe { stroke: #10B981; stroke-width: 1.6; }
    .node-risk { stroke: #fbbf24; stroke-width: 1.6; }
    .node-label { fill: #FFFFFF; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; text-anchor: middle; font-weight: 600; letter-spacing: 0.01em; }
    .node-sub { fill: #CCFF00; font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Monaco, monospace; font-size: 8.5px; text-transform: uppercase; text-anchor: middle; letter-spacing: 1.6px; font-weight: 600; }
    .node-sub-safe { fill: #10B981; }
    .node-sub-risk { fill: #fbbf24; }
    .step-badge { fill: url(#badgeGrad); stroke: rgba(198,255,0,0.38); stroke-width: 0.8; }
    .step-text { fill: #c084fc; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 8px; text-anchor: middle; font-weight: 700; letter-spacing: 1px; }
    .hdr-title { fill: #CCFF00; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 9px; font-weight: 700; letter-spacing: 2.4px; }
    .hdr-muted { fill: #8F8F8F; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 9px; font-weight: 600; letter-spacing: 2.2px; }
    .line-base { fill: none; stroke: rgba(198,255,0,0.10); stroke-width: 1.4; stroke-dasharray: 4 5; }
    .flow { fill: none; stroke: #CCFF00; stroke-width: 1.8; stroke-dasharray: 10 10; animation: dash 2.2s linear infinite; opacity: 0.62; }
    .flow-safe { fill: none; stroke: #10B981; stroke-width: 1.8; stroke-dasharray: 10 10; animation: dash 1.4s linear infinite; opacity: 0.70; }
    .flow-risk { fill: none; stroke: #fbbf24; stroke-width: 1.8; stroke-dasharray: 10 10; animation: dash 1.8s linear infinite; opacity: 0.60; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes pulsePurple { 0%,100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    @keyframes pulseSafe { 0%,100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    @keyframes pulseAmber { 0%,100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    .pulse-purple { animation: pulsePurple 2.4s infinite; }
    .pulse-safe { animation: pulseSafe 2.8s infinite; }
    .pulse-amber { animation: pulseAmber 2.6s infinite; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="rect-bg"/>
  <rect width="100%" height="100%" fill="url(#meshPurple)"/>
  <rect width="100%" height="100%" fill="url(#meshIndigo)"/>
  <rect width="100%" height="100%" fill="url(#dotGrid)" opacity="0.55"/>
  <circle cx="440" cy="230" r="360" fill="url(#centerGlow)"/>

  <!-- Header strip (left) -->
  <g transform="translate(40, 22)">
    <rect width="298" height="20" rx="10" fill="rgba(10,4,22,0.62)" stroke="rgba(198,255,0,0.22)" stroke-width="0.8"/>
    <circle cx="13" cy="10" r="3" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="hdr-title" x="26" y="13.8">DIEPS · INTENT EXECUTION PIPELINE</text>
  </g>
  <!-- Header strip (right) -->
  <g transform="translate(742, 22)">
    <rect width="98" height="20" rx="10" fill="rgba(10,4,22,0.62)" stroke="rgba(198,255,0,0.22)" stroke-width="0.8"/>
    <text class="hdr-muted" x="12" y="13.8">SUI MAINNET</text>
    <circle cx="84" cy="10" r="3" fill="#CCFF00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Base connectors -->
  <path class="line-base" d="M 140 230 L 210 230"/>
  <path class="line-base" d="M 350 230 C 370 230, 370 130, 390 130"/>
  <path class="line-base" d="M 350 230 C 370 230, 370 330, 390 330"/>
  <path class="line-base" d="M 510 130 C 530 130, 530 230, 550 230"/>
  <path class="line-base" d="M 510 330 C 530 330, 530 230, 550 230"/>
  <path class="line-base" d="M 690 230 L 750 230"/>

  <!-- Animated flow connectors -->
  <path class="flow" d="M 140 230 L 210 230"/>
  <path class="flow" d="M 350 230 C 370 230, 370 130, 390 130"/>
  <path class="flow-safe" d="M 350 230 C 370 230, 370 330, 390 330"/>
  <path class="flow" d="M 510 130 C 530 130, 530 230, 550 230"/>
  <path class="flow-safe" d="M 510 330 C 530 330, 530 230, 550 230"/>
  <path class="flow-safe" d="M 690 230 L 750 230"/>

  <!-- Traveling particles -->
  <circle r="3.4" fill="#FFFFFF" filter="url(#particleGlow)"><animateMotion dur="2s" repeatCount="indefinite" path="M 140 230 L 210 230"/></circle>
  <circle r="3.4" fill="#CCFF00" filter="url(#particleGlow)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M 350 230 C 370 230, 370 130, 390 130"/></circle>
  <circle r="3.4" fill="#10B981" filter="url(#particleGlow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 350 230 C 370 230, 370 330, 390 330"/></circle>
  <circle r="3.4" fill="#CCFF00" filter="url(#particleGlow)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M 510 130 C 530 130, 530 230, 550 230"/></circle>
  <circle r="3.4" fill="#10B981" filter="url(#particleGlow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 510 330 C 530 330, 530 230, 550 230"/></circle>
  <circle r="3.4" fill="#10B981" filter="url(#particleGlow)"><animateMotion dur="2s" repeatCount="indefinite" path="M 690 230 L 750 230"/></circle>

  <!-- 01 · User Intent -->
  <g transform="translate(40, 190)">
    <rect class="node-rect" width="100" height="80" rx="14"/>
    <line x1="14" y1="1" x2="86" y2="1" stroke="url(#topAccent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4"/>
    <text class="step-text" x="19" y="17.6">01</text>
    <circle cx="88" cy="12" r="2.6" fill="rgba(255,255,255,0.45)"/>
    <text class="node-label" x="50" y="44">User Intent</text>
    <text class="node-sub" x="50" y="60">NLP Parse</text>
  </g>

  <!-- 02 · Solver Engine (active pulse) -->
  <g transform="translate(210, 190)">
    <rect class="node-rect node-active pulse-purple" width="140" height="80" rx="14" filter="url(#nodeGlow)"/>
    <line x1="14" y1="1" x2="126" y2="1" stroke="url(#topAccent)" stroke-width="2" stroke-linecap="round"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4"/>
    <text class="step-text" x="19" y="17.6">02</text>
    <circle cx="128" cy="12" r="2.6" fill="#CCFF00"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <text class="node-label" x="70" y="44">Solver Engine</text>
    <text class="node-sub" x="70" y="60">Pattern Extract</text>
  </g>

  <!-- 03 · Graph State (active) -->
  <g transform="translate(390, 90)">
    <rect class="node-rect node-active" width="120" height="80" rx="14" filter="url(#nodeGlow)"/>
    <line x1="14" y1="1" x2="106" y2="1" stroke="url(#topAccent)" stroke-width="2" stroke-linecap="round"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4"/>
    <text class="step-text" x="19" y="17.6">03</text>
    <circle cx="108" cy="12" r="2.6" fill="#CCFF00"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="node-label" x="60" y="44">Graph State</text>
    <text class="node-sub" x="60" y="60">RPC Polling</text>
  </g>

  <!-- 04 · Routing Engine (safe pulse) -->
  <g transform="translate(390, 290)">
    <rect class="node-rect node-safe pulse-safe" width="120" height="80" rx="14" filter="url(#nodeGlow)"/>
    <line x1="14" y1="1" x2="106" y2="1" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4" style="fill: rgba(16,185,129,0.18); stroke: rgba(16,185,129,0.4);"/>
    <text class="step-text" x="19" y="17.6" style="fill: #6ee7b7;">04</text>
    <circle cx="108" cy="12" r="2.6" fill="#10B981"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <text class="node-label" x="60" y="44">Routing Engine</text>
    <text class="node-sub node-sub-safe" x="60" y="60">Routing Algo</text>
  </g>

  <!-- 05 · Risk Guardian (risk amber) -->
  <g transform="translate(550, 190)">
    <rect class="node-rect node-risk pulse-amber" width="140" height="80" rx="14" filter="url(#nodeGlow)"/>
    <line x1="14" y1="1" x2="126" y2="1" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4" style="fill: rgba(251,191,36,0.18); stroke: rgba(251,191,36,0.4);"/>
    <text class="step-text" x="19" y="17.6" style="fill: #fcd34d;">05</text>
    <circle cx="128" cy="12" r="2.6" fill="#fbbf24"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="node-label" x="70" y="44">Risk Guardian</text>
    <text class="node-sub node-sub-risk" x="70" y="60">Risk Filter</text>
  </g>

  <!-- 06 · PTB (safe, atomic execution) -->
  <g transform="translate(750, 190)">
    <rect class="node-rect node-safe" width="80" height="80" rx="14" filter="url(#nodeGlow)"/>
    <line x1="14" y1="1" x2="66" y2="1" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect class="step-badge" x="8" y="8" width="22" height="13" rx="4" style="fill: rgba(16,185,129,0.18); stroke: rgba(16,185,129,0.4);"/>
    <text class="step-text" x="19" y="17.6" style="fill: #6ee7b7;">06</text>
    <circle cx="68" cy="12" r="2.6" fill="#10B981"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <text class="node-label" x="40" y="40">PTB</text>
    <text class="node-sub node-sub-safe" x="40" y="56">Atomic Exec</text>
  </g>
</svg>
